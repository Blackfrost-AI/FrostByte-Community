name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow or pain point, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Roadmap context: FrostNet (community home) and deeper AI Assistant
        integration are planned; check existing issues before filing.