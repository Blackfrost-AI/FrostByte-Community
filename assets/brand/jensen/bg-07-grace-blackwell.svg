<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="glow7" cx="75%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0c09" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#glow7)"/>
  <!-- Grace Blackwell GB200 Superchip Board Blueprint (1x Grace + 2x Dual-Reticle Blackwell B200) -->
